<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sChartS | The King of Charts</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Core Dependencies (UMD for maximum stability) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mirage: '#131722', grid: '#1f222d',
                        tv: { blue: '#2962FF', p1: '#2E5BFF', p2: '#FF9500', border: '#2a2e39', text: '#d1d4dc', muted: '#787b86', gold: '#FFD700', up: '#26a69a', down: '#ef5350' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Roboto Mono', 'monospace'] }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #131722; }
        ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 4px; }
        body { background-color: #131722; color: #d1d4dc; overflow: hidden; user-select: none; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(19, 23, 34, 0.85); backdrop-filter: blur(25px); border: 1px solid #2a2e39; }
        .tv-card { background: #1c202b; border: 1px solid #2a2e39; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1.2s linear infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .reveal-bar { height: 4px; background: #1f222d; border-radius: 2px; overflow: hidden; }
        .reveal-fill { height: 100%; background: linear-gradient(90deg, #2E5BFF, #FF9500); transition: width 0.1s linear; }
        .copy-toast { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root">
        <div class="h-screen flex flex-col items-center justify-center bg-mirage">
            <div class="animate-spin-custom w-12 h-12 border-4 border-tv-blue border-t-transparent rounded-full shadow-[0_0_20px_rgba(41,98,255,0.2)]"></div>
            <p class="mt-8 text-[10px] tracking-[0.6em] font-black text-tv-muted uppercase">sChartS Precision Deck | v1.0.4</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const { createChart } = LightweightCharts;

        const PEER_PREFIX = "SCHarts-";
        const ASSETS = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "ADAUSDT", "XRPUSDT", "DOTUSDT", "AVAXUSDT", "MATICUSDT", "LINKUSDT", "NEARUSDT"];

        // High-Quality SVG Icons
        const Icons = {
            Logo: () => (
                <svg viewBox="0 0 100 100" className="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 80L35 55L55 65L90 20" stroke="#2962FF" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M25 85C25 85 45 45 75 35C105 25 90 90 55 95C20 100 25 85 25 85Z" stroke="#2962FF" strokeWidth="6" strokeLinecap="round"/>
                    <circle cx="90" cy="20" r="5" fill="#00E676" />
                </svg>
            ),
            Copy: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-5 h-5"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>,
            Check: () => <svg fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24" className="w-4 h-4"><path d="M5 13l4 4L19 7"/></svg>,
            Zap: () => <svg fill="currentColor" viewBox="0 0 24 24" className="w-5 h-5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
            Trophy: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-full h-full text-tv-gold"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-2.34M12 2v12.66"/></svg>,
            Back: () => <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className="w-5 h-5"><path d="M11 17l-5-5m0 0l5-5m-5 5h12"/></svg>
        };

        const App = () => {
            const [gameState, setGameState] = useState('LOBBY');
            const [localName, setLocalName] = useState(localStorage.getItem('sc_name') || '');
            const [localSeed, setLocalSeed] = useState(localStorage.getItem('sc_seed') || Math.random().toString(36).substring(7));
            const [peer, setPeer] = useState(null);
            const [conn, setConn] = useState(null);
            const [roomID, setRoomID] = useState('');
            const [isHost, setIsHost] = useState(false);
            const [opponent, setOpponent] = useState(null);
            const [activeAsset, setActiveAsset] = useState(null);
            const [ohlcv, setOhlcv] = useState([]);
            const [prediction, setPrediction] = useState('');
            const [remotePrediction, setRemotePrediction] = useState(null);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isRevealing, setIsRevealing] = useState(false);
            const [revealTick, setRevealTick] = useState(500);
            const [showCopyMsg, setShowCopyMsg] = useState(false);

            const chartContainer = useRef(null);
            const chartApi = useRef(null);
            const barSeries = useRef(null);

            // STABLE PeerJS Init
            const initPeer = (id, asHost) => {
                const config = {
                    debug: 1,
                    config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }] }
                };
                
                const p = new Peer(asHost ? PEER_PREFIX + id : undefined, config);
                
                p.on('open', (pid) => {
                    setPeer(p);
                    setRoomID(asHost ? id : pid);
                    if(!asHost) {
                        const c = p.connect(PEER_PREFIX + id, { reliable: true });
                        setupConn(c);
                    }
                });

                p.on('connection', (c) => setupConn(c));
                
                p.on('error', (err) => {
                    console.error("PEER ERROR:", err.type);
                    if(err.type === 'peer-unavailable') alert("Raum nicht gefunden oder Code ungültig.");
                    if(err.type === 'unavailable-id') alert("Dieser Code ist bereits vergeben.");
                    setGameState('LOBBY');
                });
            };

            const setupConn = (c) => {
                setConn(c);
                c.on('open', () => {
                    c.send({ type: 'HANDSHAKE', name: localName, seed: localSeed });
                    setGameState('WAITING');
                });
                c.on('data', (d) => {
                    if(d.type === 'HANDSHAKE') {
                        setOpponent({ name: d.name, seed: d.seed });
                        if(isHost) c.send({ type: 'HANDSHAKE', name: localName, seed: localSeed });
                    }
                    if(d.type === 'START_GAME') { setActiveAsset(d.asset); loadData(d.asset); }
                    if(d.type === 'SUBMIT_PRICE') setRemotePrediction(parseFloat(d.price));
                    if(d.type === 'REVEAL_START') setIsRevealing(true);
                    if(d.type === 'RESTART') restartDuel();
                });
                c.on('close', () => { alert("Verbindung zum Gegner verloren."); location.reload(); });
            };

            const loadData = async (symbol) => {
                setGameState('ARENA');
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=601`);
                    const data = await res.json();
                    setOhlcv(data.map(b => ({ time: b[0]/1000, open: parseFloat(b[1]), high: parseFloat(b[2]), low: parseFloat(b[3]), close: parseFloat(b[4]) })));
                } catch(e) { alert("Fehler beim Laden der Marktdaten."); }
            };

            const startDuel = () => {
                const asset = ASSETS[Math.floor(Math.random() * ASSETS.length)];
                setActiveAsset(asset);
                conn.send({ type: 'START_GAME', asset });
                loadData(asset);
            };

            const handlePrediction = () => {
                setIsSubmitted(true);
                conn.send({ type: 'SUBMIT_PRICE', price: prediction });
            };

            const handleReveal = () => { setIsRevealing(true); conn.send({ type: 'REVEAL_START' }); };
            
            const restartDuel = () => {
                setGameState('WAITING'); setIsSubmitted(false); setPrediction(''); setRemotePrediction(null); setRevealTick(500); setIsRevealing(false);
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(roomID);
                setShowCopyMsg(true);
                setTimeout(() => setShowCopyMsg(false), 2000);
            };

            // TradingView Charts Execution
            useEffect(() => {
                if((gameState === 'ARENA' || gameState === 'SHOWDOWN') && chartContainer.current && ohlcv.length > 0) {
                    if(chartApi.current) chartApi.current.remove();
                    const chart = createChart(chartContainer.current, {
                        layout: { background: { color: '#131722' }, textColor: '#d1d4dc', fontFamily: 'Inter' },
                        grid: { vertLines: { color: '#1f222d' }, horzLines: { color: '#1f222d' } },
                        timeScale: { borderColor: '#2a2e39', timeVisible: true },
                        rightPriceScale: { borderColor: '#2a2e39' }
                    });
                    const series = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false });
                    
                    if(gameState === 'ARENA') { 
                        series.setData(ohlcv.slice(0, 500)); 
                    } else {
                        series.setData(ohlcv.slice(0, revealTick));
                        series.createPriceLine({ price: isHost ? parseFloat(prediction) : remotePrediction, color: '#2E5BFF', lineWidth: 2, title: isHost ? 'DU' : opponent?.name });
                        series.createPriceLine({ price: isHost ? remotePrediction : parseFloat(prediction), color: '#FF9500', lineWidth: 2, title: isHost ? opponent?.name : 'DU' });
                    }
                    chartApi.current = chart; barSeries.current = series;
                    chart.timeScale().fitContent();
                    return () => chart.remove();
                }
            }, [gameState, ohlcv, revealTick]);

            useEffect(() => { if(isSubmitted && remotePrediction !== null) setGameState('SHOWDOWN'); }, [isSubmitted, remotePrediction]);

            useEffect(() => {
                if(isRevealing && revealTick < 600) {
                    const t = setTimeout(() => {
                        setRevealTick(p => p + 1);
                        if(barSeries.current) barSeries.current.update(ohlcv[revealTick]);
                    }, 50);
                    return () => clearTimeout(t);
                } else if(revealTick >= 600) { setTimeout(() => setGameState('RESULT'), 1500); }
            }, [isRevealing, revealTick]);

            // UI Elements
            const PlayerTag = ({ seed, size="w-16 h-16", color="#2962FF", label="" }) => (
                <div className="flex flex-col items-center gap-4 animate-in fade-in slide-in-from-bottom duration-500">
                    <div className={`relative ${size}`}>
                        <div className="absolute inset-0 rounded-full blur-[6px] opacity-25" style={{background: color}}></div>
                        <img src={`https://api.dicebear.com/9.x/avataaars/svg?seed=${seed}`} className={`relative rounded-full border-2 bg-grid shadow-2xl h-full w-full object-cover`} style={{borderColor: color}} />
                    </div>
                    {label && <div className="text-xl font-bold italic text-white uppercase tracking-tighter">{label}</div>}
                </div>
            );

            if(gameState === 'ARENA' || gameState === 'SHOWDOWN') return (
                <div className="flex h-screen bg-mirage overflow-hidden font-sans">
                    <aside className="w-80 border-r border-tv-border flex flex-col bg-mirage/95 z-20 shadow-2xl">
                        <div className="p-8 border-b border-tv-border flex items-center gap-5">
                            <div className="w-10 h-10"><Icons.Logo /></div>
                            <div><h2 className="text-2xl font-black italic text-white tracking-tighter leading-tight">sChartS</h2><span className="text-[10px] font-bold text-tv-muted uppercase tracking-[0.4em]">Battle Unit</span></div>
                        </div>
                        <div className="flex-1 p-6 space-y-10 overflow-y-auto">
                            <div className="space-y-4">
                                <span className="text-[10px] font-black text-tv-muted uppercase tracking-widest px-1">Markt Instrument</span>
                                <div className="tv-card p-6 rounded-3xl relative overflow-hidden group border-tv-blue/20">
                                    <div className="absolute inset-0 bg-tv-blue/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                    <div className="flex items-center justify-between"><span className="text-3xl font-black font-mono text-white italic">{activeAsset}</span><span className="bg-tv-blue/10 text-tv-blue text-[10px] px-4 py-1.5 rounded-full font-black">1H</span></div>
                                </div>
                            </div>
                            <div className="space-y-5 pt-5 border-t border-tv-border">
                                <label className="text-[10px] font-black text-tv-muted uppercase tracking-widest px-1">Deine Prognose</label>
                                <div className="relative">
                                    <input type="number" disabled={isSubmitted} value={prediction} onChange={(e)=>setPrediction(e.target.value)} className="w-full bg-grid/30 border-2 border-tv-border p-6 rounded-3xl font-mono text-4xl text-white outline-none focus:border-tv-blue transition-all" placeholder="0.00" />
                                    <div className="absolute right-6 top-1/2 -translate-y-1/2 text-[10px] font-bold text-tv-muted">USDT</div>
                                </div>
                                <button disabled={isSubmitted || !prediction} onClick={handlePrediction} className="w-full bg-tv-blue text-white py-5 rounded-2xl font-black text-lg tracking-widest flex items-center justify-center gap-3 hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-blue-600/20 disabled:opacity-20">
                                    <Icons.Send />
                                    <span>{isSubmitted ? "BEREIT" : "ANALYSE SENDEN"}</span>
                                </button>
                            </div>
                            {isRevealing && (
                                <div className="p-6 bg-tv-blue/10 border border-tv-blue/30 rounded-3xl space-y-5 animate-in slide-in-from-bottom duration-500">
                                    <div className="flex justify-between items-center"><span className="text-[10px] font-black text-tv-blue uppercase tracking-widest">Live Distanz</span><span className="text-5xl font-mono font-black text-white">{(600-revealTick)}</span></div>
                                    <div className="reveal-bar"><div className="reveal-fill" style={{width:`${(revealTick-500)}%`}}></div></div>
                                </div>
                            )}
                        </div>
                        <div className="p-6 border-t border-tv-border bg-grid/10 flex items-center gap-4">
                            <PlayerTag seed={localSeed} size="w-14 h-14" />
                            <div className="flex flex-col"><span className="text-base font-black text-white italic">{localName}</span><span className="text-[9px] font-bold text-tv-muted uppercase tracking-widest">Status: Trading</span></div>
                        </div>
                    </aside>
                    <main className="flex-1 relative">
                        <header className="absolute top-0 left-0 right-0 h-16 border-b border-tv-border flex items-center justify-between px-10 z-10 bg-mirage/60 backdrop-blur-xl">
                            <div className="flex items-center gap-2"><Icons.Zap /><span className="text-[11px] font-black text-white uppercase tracking-[0.4em] italic">Precision Arena</span></div>
                            <div className="flex items-center gap-8">
                                {remotePrediction !== null && !isRevealing && isHost && <button onClick={handleReveal} className="bg-tv-gold text-black px-10 py-2.5 rounded-xl font-black italic tracking-widest shadow-xl shadow-yellow-500/20 animate-pulse transition-all hover:scale-105 active:scale-95">REVEAL STARTEN</button>}
                                {remotePrediction !== null && <div className="flex items-center gap-3 bg-tv-up/10 px-5 py-2 rounded-full border border-tv-up/30 text-tv-up text-[10px] font-bold uppercase tracking-widest leading-none">Gegner Bereit</div>}
                            </div>
                        </header>
                        <div className="w-full h-full" ref={chartContainer}></div>
                    </main>
                </div>
            );

            if(gameState === 'RESULT') {
                const final = ohlcv[599]?.close || 0;
                const mD = Math.abs((parseFloat(prediction)-final)/final*100);
                const rD = Math.abs((remotePrediction-final)/final*100);
                const win = mD < rD;
                return (
                    <div className="h-screen bg-mirage flex flex-col items-center justify-center p-12 overflow-y-auto animate-in fade-in zoom-in duration-1000">
                        <div className="max-w-6xl w-full text-center space-y-20 relative">
                            <div className="absolute inset-0 bg-tv-blue/5 blur-[120px] rounded-full -z-10"></div>
                            <div className="space-y-4">
                                <div className="w-32 h-32 mx-auto animate-float"><Icons.Trophy /></div>
                                <h1 className="text-[11rem] font-black italic tracking-tighter text-white leading-none">THE <span className="text-tv-blue">KING</span></h1>
                                <p className="text-xl font-mono font-bold text-tv-muted uppercase tracking-[1em] opacity-40">Result Protocol</p>
                            </div>
                            <div className="grid grid-cols-3 gap-16 items-center">
                                <div className={`glass-panel p-12 rounded-[4rem] transition-all duration-700 ${win ? 'border-tv-gold scale-110 shadow-[0_0_80px_rgba(255,215,0,0.15)]' : 'opacity-40 grayscale blur-[1px]'}`}>
                                    <PlayerTag seed={localSeed} size="w-32 h-32" color={win?"#FFD700":"#2962FF"} />
                                    <h3 className="text-2xl font-black italic text-white mt-8">{localName}</h3>
                                    <div className="text-6xl font-mono font-black mt-4 text-tv-blue">{myD.toFixed(4)}%</div>
                                </div>
                                <div className="space-y-10">
                                    <div className="space-y-2"><div className="text-[11px] font-bold text-tv-muted uppercase tracking-[0.5em]">Markt Schluss</div><div className="text-7xl font-mono font-black text-tv-up select-all">{final.toFixed(2)}</div></div>
                                    <div className="h-[2px] bg-gradient-to-r from-transparent via-tv-border to-transparent"></div>
                                    <div className="text-sm font-bold text-tv-muted italic">{activeAsset} | 1H</div>
                                </div>
                                <div className={`glass-panel p-12 rounded-[4rem] transition-all duration-700 ${!win ? 'border-tv-gold scale-110 shadow-[0_0_80px_rgba(255,215,0,0.15)]' : 'opacity-40 grayscale blur-[1px]'}`}>
                                    <PlayerTag seed={opponent?.seed} size="w-32 h-32" color={!win?"#FFD700":"#F15B2F"} />
                                    <h3 className="text-2xl font-black italic text-white mt-8">{opponent?.name}</h3>
                                    <div className="text-6xl font-mono font-black mt-4 text-tv-p2">{rD.toFixed(4)}%</div>
                                </div>
                            </div>
                            <button onClick={()=>location.reload()} className="bg-tv-gold text-black px-24 py-8 text-3xl font-black italic rounded-[2.5rem] shadow-2xl hover:scale-105 active:scale-95 transition-all">NEUE SESSION</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen bg-mirage text-tv-text flex flex-col items-center justify-center p-10 relative overflow-hidden">
                    {gameState === 'LOBBY' && (
                        <div className="w-full max-w-6xl space-y-24 animate-in fade-in duration-1000">
                            <div className="text-center space-y-6">
                                <div className="w-32 h-32 mx-auto animate-float drop-shadow-[0_0_30px_rgba(41,98,255,0.4)]"><Icons.Logo /></div>
                                <h1 className="text-[12rem] font-black italic text-white tracking-tighter leading-none select-none">sChart<span className="text-tv-blue underline decoration-[15px] decoration-tv-blue">S</span></h1>
                                <p className="text-2xl font-mono font-bold text-tv-muted uppercase tracking-[0.8em] opacity-40">Precision Trading Pit</p>
                            </div>
                            <div className="grid grid-cols-2 gap-12">
                                <section className="glass-panel p-16 rounded-[4rem] border-b-[16px] border-b-tv-blue space-y-12 shadow-2xl">
                                    <div className="flex flex-col items-center gap-10">
                                        <div onClick={()=>setLocalSeed(Math.random().toString(36).substring(7))} className="cursor-pointer transition-transform hover:scale-105 active:scale-95"><PlayerTag seed={localSeed} size="w-48 h-48" /></div>
                                        <div className="w-full space-y-4 text-left">
                                            <label className="text-[10px] font-black text-tv-muted uppercase tracking-widest px-4 block">DEIN NAME</label>
                                            <input type="text" value={localName} onChange={(e)=>{setLocalName(e.target.value); localStorage.setItem('sc_name', e.target.value)}} placeholder="Z.B. ChartKing_X" className="w-full bg-grid/30 border-2 border-tv-border p-6 rounded-[2.5rem] font-mono text-3xl text-center text-white focus:border-tv-blue outline-none transition-all shadow-inner" />
                                        </div>
                                    </div>
                                </section>
                                <section className="glass-panel p-16 rounded-[4rem] border-b-[16px] border-b-tv-gold space-y-10 flex flex-col justify-between shadow-2xl">
                                    <button onClick={()=>{setIsHost(true);initPeer(Math.random().toString(36).substring(2,6).toUpperCase(), true)}} disabled={!localName} className="w-full bg-tv-blue text-white py-12 rounded-[2.5rem] text-4xl font-black italic shadow-2xl hover:brightness-110 active:scale-[0.98] transition-all disabled:opacity-20">HOST SESSION</button>
                                    <div className="flex items-center gap-6"><div className="flex-1 h-[2px] bg-tv-border"></div><span className="text-[11px] font-black text-tv-muted uppercase tracking-[0.4em]">ODER BEITRETEN</span><div className="flex-1 h-[2px] bg-tv-border"></div></div>
                                    <input type="text" placeholder="BATTLE CODE" maxLength={4} onChange={(e)=>{const v=e.target.value.toUpperCase(); if(v.length===4){setIsHost(false);initPeer(v, false)}}} className="w-full bg-grid/30 border-2 border-tv-border p-6 rounded-[2.5rem] font-mono text-5xl text-center text-tv-blue font-black tracking-[0.4em] outline-none" />
                                </section>
                            </div>
                        </div>
                    )}
                    {gameState === 'WAITING' && (
                        <div className="w-full max-w-5xl space-y-16 text-center animate-in zoom-in duration-500">
                            <h2 className="text-8xl font-black text-white italic tracking-tighter uppercase">{opponent ? "READY FOR BATTLE" : "SCANNING PEERS..."}</h2>
                            <div className="glass-panel p-20 rounded-[5rem] space-y-16 border-t-[20px] border-t-tv-blue shadow-3xl relative">
                                <div className="flex flex-col gap-6">
                                    <div className="text-[14px] font-black text-tv-muted uppercase tracking-[0.8em]">BATTLE ID</div>
                                    <div className="flex items-center justify-center gap-6">
                                        <div className="text-[12rem] font-black text-tv-blue font-mono leading-none tracking-widest">{roomID}</div>
                                        <button onClick={copyToClipboard} className="p-5 rounded-3xl bg-tv-blue/10 border border-tv-blue/30 text-tv-blue hover:bg-tv-blue/20 transition-all active:scale-90">
                                            {showCopyMsg ? <Icons.Check /> : <Icons.Copy />}
                                        </button>
                                    </div>
                                    {showCopyMsg && <div className="text-tv-up font-bold text-xs uppercase tracking-widest copy-toast">CODE KOPIERT!</div>}
                                </div>
                                <div className="grid grid-cols-2 gap-32">
                                    <div className="space-y-6"><PlayerTag seed={localSeed} size="w-56 h-56" color="#2E5BFF" label={localName} /><span className="text-[10px] font-bold text-tv-blue tracking-[0.4em] uppercase">Session Owner</span></div>
                                    <div className={`space-y-6 transition-all duration-1000 ${!opponent ? 'opacity-5 blur-[30px] scale-50' : 'opacity-100'}`}>
                                        <PlayerTag seed={opponent?.seed||'X'} size="w-56 h-56" color="#F15B2F" label={opponent?.name||'---'} />
                                        <span className="text-[10px] font-bold text-tv-p2 tracking-[0.4em] uppercase">Rival Trader</span>
                                    </div>
                                </div>
                            </div>
                            {isHost && (
                                <button disabled={!opponent} onClick={startDuel} className="w-full bg-tv-gold text-black py-12 rounded-[3.5rem] text-7xl font-black italic tracking-widest shadow-tv-gold/30 animate-bounce disabled:opacity-20 disabled:animate-none active:scale-95 transition-all">
                                    ENTER ARENA
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
